# Creator-selection scoring rules.
#
# Fixed before any creator is scored, so the weighting cannot be tuned to a
# result. Authored without opening creator_posts.csv: the scoring window is
# written as a rule (anchor date + length) for the scoring script to resolve,
# so no figure here is hand-copied from the data. This file is not edited after
# any creator is scored; any change is a new commit with the reason in
# DECISIONS.md.

# 12-month window, resolved by the scoring script. The script reads only the
# single latest posted_on date from creator_posts.csv to set the anchor.
window:
  length_months: 12
  end_anchor: latest posted_on in creator_posts.csv
  inclusive: true

# Three weighted components; weights sum to 1.0. Each component is converted to
# a percentile rank among the 20 creators before weighting (see scoring).
components:
  evidence_fit:
    weight: 0.40
    definition: share of window posts with children_on_camera == "yes" AND product_shown == "yes"
    range: [0, 1]
    min_data: none

  audience_response:
    weight: 0.35
    definition: median over window posts of (comments + reshares) / plays
    posts_included: posts with plays only
    likes_used: false
    min_data:
      rule: requires >= 10 posts with plays
      on_insufficient:
        status: insufficient
        score: 0.5          # neutral
        flag: insufficient_audience_response

  sponsored_fit:
    weight: 0.25
    definition: >-
      median engagement of is_sponsored == "yes" posts divided by median
      engagement of is_sponsored == "no" posts, same window
    engagement_metric: (comments + reshares) / plays per post, posts with plays only, likes excluded
    min_data:
      rule: requires >= 4 sponsored posts
      on_insufficient:
        status: insufficient
        score: 0.5          # neutral
        flag: insufficient_sponsored_fit
    edge: if there are no non-sponsored posts or the non-sponsored median is 0, treat as insufficient (neutral 0.5)

# How the components become a composite.
scoring:
  per_component: convert to percentile rank among the 20 creators (range 0..1)
  insufficient_components: use the neutral 0.5 in place of the percentile rank
  composite: weighted sum of the three component scores using the weights above
  seed: 42

# Zero weight, not used as scoring inputs.
excluded_inputs:
  - parent persona
  - hook_type
  - ad_format
  - creator_type
  - hypotheses tiered fragile: [H2, H4, H5, H7, H9]   # from outputs/ads/findings.csv

# Flags only. None of these change any score; they travel with a creator for
# human review.
flags:
  hidden_likes:
    creator_ids: [CR-02, CR-09, CR-17]
  no_audience_data:
    rule: all creators other than CR-14, CR-15, CR-20
    creator_ids: [CR-01, CR-02, CR-03, CR-04, CR-05, CR-06, CR-07, CR-08, CR-09, CR-10,
                  CR-11, CR-12, CR-13, CR-16, CR-17, CR-18, CR-19]
  legal_review_flag:
    rule: clinical persona — persona contains "pediatric" or "doctor" (case-insensitive)
    creator_ids: [CR-01, CR-03, CR-09, CR-14, CR-16]

# Stability of the top-5 under weight perturbation.
stability:
  draws: 200
  seed: 42
  weight_jitter: each weight multiplied by uniform(0.7, 1.3), then renormalised to sum 1
  report: share of draws each creator is in the top 5

# Portfolio constraints on the final five.
portfolio:
  max_clinical_persona_in_final_5: 2
  follower_size_quota: none
  followers: context only, not scored
  pricing_data: none

note: this file is not edited after any creator is scored.
